<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Покупка</title>
</head>
<body>
    <div>
        <h3>Покупка: {{ product.name }}, {{ product.price }} руб.</h3>
        {{ form.non_field_errors }}
        <form method="post">{% csrf_token %}
            <input type="hidden" value="{{ view.kwargs.product_id }}" name="product" />
            <table>
                <tr>
                    <td><p>Введите свое имя:</p></td>
                    <td>
                        <input type="text" name="person" value="{{ form.person.value|default_if_none:'' }}" />
                        {{ form.person.errors }}
                    </td>
                </tr>
                <tr>
                    <td><p>Введите адрес доставки:</p></td>
                    <td>
                        <input type="text" name="address" value="{{ form.address.value|default_if_none:'' }}" />
                        {{ form.address.errors }}
                    </td>
                </tr>
                <tr><td><input type="submit" value="Отправить" /> </td><td></td></tr>
            </table>
            {{ form.product.errors }}
        </form>
        <p><a href="{% url 'index' %}">Назад к списку</a></p>
    </div>
</body>
</html>
